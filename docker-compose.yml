version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:4000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
